[project]
name = "langchain-langgraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "CristobalUll", email = "alu0101755601@ull.edu.es" }
]
requires-python = ">=3.14"
dependencies = [
    "black>=26.5.1",
    "deepagents>=0.7.8",
    "isort>=8.0.1",
    "langchain>=1.3.16",
    "langchain-openai>=1.6.0",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.3",
]

[project.scripts]
langchain-langgraph = "langchain_langgraph:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
